<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marca | Farmácia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style/marca-detalhe.css">
</head>

<body class="marca-pagina">

    <!-- CABEÇALHO (podes trocar pelo teu; o JS só precisa de #marca-q e #marca-cart-n) -->
    <header class="marca-topo">
        <div class="marca-topo-in">
            <a class="marca-logo" href="index.html" aria-label="Farmácia — página inicial">
                <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
                    <path d="M16 2h14v14h14v14H30v14H16V30H2V16h14z" fill="#25D366" />
                    <g stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round">
                        <path d="M23 12v22" />
                        <path d="M18.5 16c0 3 9 3 9 6.5s-9 3-9 6.5" />
                    </g>
                </svg>
                Farmácia
            </a>

            <form class="marca-pesquisa" role="search" onsubmit="return false">
                <input id="marca-q" type="search" placeholder="A tua pesquisa..." aria-label="Pesquisar"
                    autocomplete="off">
                <button type="submit" aria-label="Pesquisar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round">
                        <circle cx="11" cy="11" r="7" />
                        <path d="m20 20-3.5-3.5" />
                    </svg>
                </button>
            </form>

            <nav class="marca-nav" aria-label="Principal">
                <a href="categorias.html">categorias</a>
                <a href="index.html#marcas">marcas</a>
                <a href="sobre.html">sobre</a>
            </nav>

            <a class="marca-carrinho" href="carrinho.html" aria-label="Ver carrinho">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="20" r="1.4" />
                    <circle cx="18" cy="20" r="1.4" />
                    <path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 7H6" />
                </svg>
                <span class="marca-carrinho-n" id="marca-cart-n" hidden>0</span>
            </a>
        </div>
    </header>

    <!-- Banner, filtros e produtos são desenhados pelo marca-detalhe.js -->
    <main id="marca-app"></main>

    <div class="marca-overlay" id="marca-overlay"></div>
    <div class="marca-toast" id="marca-toast" role="status" aria-live="polite"></div>

    <script src="../style/marca-detalhe.js"></script>
</body>

</html>
